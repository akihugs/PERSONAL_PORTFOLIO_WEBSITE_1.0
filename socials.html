<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Socials | My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #3C0527;
            font-family: Arial, sans-serif;
            color: #3C0527;
        }

        /* FIXED NAVBAR */
        .navbar {
            position: fixed;
            top: 26px;
            left: 3%;
            z-index: 1000;

            width: 92%;
            height: 20%;
            min-height: 65px;
            max-height: 115px;

            background-color: #3C0527;
            border-radius: 35px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            gap: 20px;
        }

        /* PORTFOLIO LOGO */
        .logo {
            color: #FFC18D;
            font-family: Georgia, serif;
            font-size: clamp(15px, 4vw, 44px);
            font-weight: bold;
            font-style: italic;
            text-decoration: none;
            white-space: nowrap;
        }

        /* NAVBAR LINKS */
        .nav-links {
            display: flex;
            align-items: center;
            gap: clamp(12px, 3.5vw, 42px);
        }

        .nav-links a {
            color: #FFC18D;
            font-size: clamp(11px, 2.8vw, 34px);
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: #FFFFFF;
            text-decoration: underline;
        }

        /* CONTACT SECTION: grid background + Canva banner on top */
        .contact-content {
            position: relative;
            isolation: isolate;          /* keeps the banner behind the content */

            background-color: #F47EAA;
            background-image:
                linear-gradient(#FFFFFF70 1px, transparent 1px),
                linear-gradient(90deg, #FFFFFF70 1px, transparent 1px);
            background-size: 22px 22px;

            /* top padding clears the fixed navbar */
            padding: clamp(130px, 15vw, 180px) 5% 60px;
        }

        /* the Canva image, cropped to just its top part */
        .contact-content::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: clamp(260px, 40vw, 520px);
            z-index: -1;

            background: url("page03.png") top center / 100% auto no-repeat;

            /* fades the image out so it blends into the grid below */
            -webkit-mask-image: linear-gradient(#000 65%, transparent);
            mask-image: linear-gradient(#000 65%, transparent);
        }

        /* SECTION HEADING */
        .contact-heading {
            text-align: center;
            margin-bottom: 38px;
        }

        .contact-heading h1 {
            color: #3C0527;
            font-family: Georgia, serif;
            font-size: clamp(34px, 5vw, 56px);
            margin: 0 0 12px;
        }

        .contact-heading p {
            color: #3C0527;
            font-size: 16px;
            line-height: 1.7;
            margin: 0;
        }

        /* TWO-COLUMN LAYOUT */
        .contact-layout {
            display: grid;
            grid-template-columns: 0.85fr 1.4fr;
            gap: 28px;

            max-width: 1200px;
            margin: 0 auto;

            align-items: stretch;
        }

        /* SOCIAL LINKS BOX */
        .social-box {
            background-color: #3C0527;
            color: #FFC18D;

            padding: 28px;
            border-radius: 24px;
            box-shadow: 7px 7px 0 #903D5B;
        }

        .social-box h2,
        .form-box h2 {
            font-family: Georgia, serif;
            font-size: 27px;
            margin: 0 0 15px;
        }

        .social-intro {
            line-height: 1.7;
            margin-bottom: 24px;
        }

        /* SOCIAL MEDIA CARDS */
        .social-link {
            display: block;

            background-color: #903D5B;
            color: #FFFDF9;
            text-decoration: none;

            padding: 17px;
            margin-top: 15px;

            border: 1px solid #FFC18D;
            border-radius: 14px;

            overflow-wrap: anywhere;
            transition: background-color 0.2s, transform 0.2s;
        }

        .social-link strong {
            display: block;
            color: #FFC18D;
            font-size: 18px;
            margin-bottom: 7px;
        }

        .social-link:hover {
            background-color: #6F2857;
            transform: translateY(-3px);
        }

        .social-note {
            font-size: 14px;
            line-height: 1.7;
            margin: 22px 0 0;
        }

        /* CONTACT FORM BOX */
        .form-box {
            background-color: #FFFDF9;
            color: #3C0527;

            padding: 30px;
            border-radius: 24px;
            box-shadow: 7px 7px 0 #903D5B;
        }

        .form-description {
            color: #6F2857;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        /* FORM FIELDS */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label,
        .gender-title {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px;

            border: 1px solid #C9A7B6;
            border-radius: 9px;

            background-color: #FFFFFF;
            color: #3C0527;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: 2px solid #903D5B;
            border-color: #903D5B;
        }

        .form-group textarea {
            min-height: 145px;
            resize: vertical;
        }

        /* GENDER OPTIONS */
        .gender-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-top: 12px;
        }

        .gender-options label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: normal;
            cursor: pointer;
        }

        .gender-options input {
            width: auto;
            accent-color: #903D5B;
        }

        /* SEND MESSAGE BUTTON */
        .submit-button {
            display: inline-block;

            padding: 15px 27px;
            border: none;
            border-radius: 11px;

            background-color: #3C0527;
            color: #FFC18D;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #903D5B;
        }

        /* TABLET LAYOUT */
        @media (max-width: 750px) {
            .navbar {
                width: 94%;
                left: 3%;
                height: auto;
                min-height: 65px;
                padding: 12px 3%;
                border-radius: 22px;
                gap: 12px;
            }

            .logo {
                font-size: 19px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .contact-layout {
                grid-template-columns: 1fr;
            }

            .social-box,
            .form-box {
                padding: 24px;
            }
        }

        /* SMALL MOBILE SCREENS */
        @media (max-width: 420px) {
            .navbar {
                padding: 10px 2%;
                gap: 8px;
                border-radius: 17px;
            }

            .logo {
                font-size: 15px;
            }

            .nav-links {
                gap: 7px;
            }

            .nav-links a {
                font-size: 10px;
            }

            .contact-content {
                padding: 115px 5% 45px;
            }

            .contact-heading h1 {
                font-size: 34px;
            }

            .contact-heading p {
                font-size: 14px;
            }

            .social-box,
            .form-box {
                padding: 20px;
            }

            .gender-options {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <a href="socials.html" class="logo">
            Socials
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="socials.html">Socials</a>
        </div>

    </nav>

    <!-- SOCIALS AND CONTACT SECTION (Canva banner sits behind the top via CSS) -->
    <main class="contact-content">

        <header class="contact-heading">
            <h1>Let's Connect!</h1>
        </header>

        <div class="contact-layout">

            <!-- LEFT COLUMN: SOCIAL LINKS -->
            <section class="social-box">

                <a class="social-link"
                   href="https://www.instagram.com/akihugs"
                   target="_blank"
                   rel="noopener noreferrer">

                    <strong>Instagram ↗</strong>
                    @akihugs
                    <br>
                </a>

                <a class="social-link"
                   href="https://www.instagram.com/guhikasaha"
                   target="_blank"
                   rel="noopener noreferrer">

                    <strong>Instagram ↗</strong>
                    @guhikasaha
                    <br>
                </a>

                <a class="social-link"
                   href="https://www.linkedin.com/in/guhika-saha-5a523726b/"
                   target="_blank"
                   rel="noopener noreferrer">

                    <strong>LinkedIn ↗</strong>
                    <br>
                </a>

                <a class="social-link"
                   href="https://github.com/akihugs"
                   target="_blank"
                   rel="noopener noreferrer">

                    <strong>GitHub ↗</strong>
                </a>

                <a class="social-link"
                   href="https://akihugs.itch.io/"
                   target="_blank"
                   rel="noopener noreferrer">

                    <strong>Itch.io ↗</strong>
                </a>

                <a class="social-link">
    
                <strong>Email ↗</strong>
                <p>guhikasaha@gmail.com</p>
                </a>

            </section>

            <!-- RIGHT COLUMN: CONTACT FORM -->
            <section class="form-box">

                <h2>Reach Out to Me!</h2>

                <form action="#" method="get">

                    <!-- NAME -->
                    <div class="form-group">

                        <label for="name">
                            Your Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>

                    <!-- GENDER -->
                    <div class="form-group">

                        <span class="gender-title">
                            Gender
                        </span>

                        <div class="gender-options">

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="female"
                                    required
                                >
                                Female
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="male"
                                >
                                Male
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="other"
                                >
                                Other
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="prefer-not-to-say"
                                >
                                Prefer not to say
                            </label>

                        </div>

                    </div>

                    <!-- MESSAGE -->
                    <div class="form-group">

                        <label for="message">
                            Your Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            placeholder="Write your message here..."
                            required
                        ></textarea>

                    </div>

                    <!-- SUBMIT BUTTON -->
                    <button type="submit" class="submit-button">
                        Send Message →
                    </button>

                </form>

            </section>

        </div>

    </main>

</body>
</html>
